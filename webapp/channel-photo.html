<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --lime:#C4F000; --green-dk:#14342A; --light:#F4F4F0; --olive:#7DA800;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1350px;overflow:hidden}
  body{font-family:Inter,system-ui,sans-serif;background:#0E1A14;-webkit-font-smoothing:antialiased}

  .stage{position:absolute;inset:0;overflow:hidden}
  .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

  /* scrims для читаемости поверх любого фото */
  .scrim-top{position:absolute;top:0;left:0;right:0;height:300px;
    background:linear-gradient(180deg,rgba(7,14,11,.62) 0%,rgba(7,14,11,0) 100%)}
  .scrim-bot{position:absolute;left:0;right:0;bottom:0;height:620px;
    background:linear-gradient(0deg,rgba(7,14,11,.86) 0%,rgba(7,14,11,.55) 42%,rgba(7,14,11,0) 100%)}

  /* фирменная рамка */
  .frame{position:absolute;inset:30px;border:5px solid rgba(196,240,0,.92);border-radius:30px;pointer-events:none;
    box-shadow:0 0 0 1px rgba(0,0,0,.25), inset 0 0 60px rgba(0,0,0,.25)}

  /* верхняя панель */
  .top{position:absolute;top:62px;left:64px;right:64px;display:flex;align-items:center;gap:20px}
  .rubric{display:inline-flex;align-items:center;gap:14px;background:var(--lime);color:var(--green-dk);
    font-family:Oswald,sans-serif;font-weight:700;font-size:30px;letter-spacing:.12em;text-transform:uppercase;
    padding:14px 26px;border-radius:999px;box-shadow:0 8px 22px rgba(0,0,0,.35)}
  .rubric .ic{font-size:30px;line-height:1}
  .brand{margin-left:auto;display:flex;align-items:center;gap:16px}
  .badge{width:74px;height:74px;border-radius:20px;flex:0 0 auto;box-shadow:0 8px 24px rgba(0,0,0,.45)}
  .brandname{font-family:Oswald,sans-serif;font-weight:700;font-size:30px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--light);text-shadow:0 2px 12px rgba(0,0,0,.6)}

  /* хук-крючок (одна короткая фраза) */
  .hookwrap{position:absolute;left:64px;right:64px;bottom:120px}
  .kicker{font-family:Oswald,sans-serif;font-weight:600;font-size:30px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--lime);margin-bottom:18px;text-shadow:0 2px 10px rgba(0,0,0,.6)}
  .hook{font-family:Oswald,sans-serif;font-weight:700;font-size:80px;line-height:1.04;letter-spacing:.004em;
    text-transform:uppercase;color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.72)}
  .hook .ac{color:var(--lime)}

  .foot{position:absolute;left:64px;right:64px;bottom:54px;display:flex;align-items:center;justify-content:space-between}
  .handle{font-family:Oswald,sans-serif;font-weight:700;font-size:34px;letter-spacing:.05em;color:var(--lime);
    text-shadow:0 2px 10px rgba(0,0,0,.6)}
  .src{font-size:24px;color:rgba(244,244,240,.78);text-shadow:0 2px 8px rgba(0,0,0,.6)}
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute"><defs>
    <symbol id="mark-light" viewBox="0 0 240 240">
      <rect width="240" height="240" rx="48" fill="#F4F4F0"/>
      <rect x="60" y="90" width="120" height="13" rx="6.5" fill="#16291F"/>
      <path d="M120 103 L113 190 L120 206 L127 190 Z" fill="#16291F"/>
      <circle cx="120" cy="90" r="14" fill="#7DA800"/>
    </symbol>
  </defs></svg>

  <div class="stage">
    <img class="photo" id="photo" src="">
    <div class="scrim-top"></div>
    <div class="scrim-bot"></div>
    <div class="frame"></div>

    <div class="top">
      <span class="rubric"><span class="ic" id="ric">🔥</span><span id="rtext">ЗАЛЕТЕЛО</span></span>
      <span class="brand"><svg class="badge"><use href="#mark-light"/></svg><span class="brandname">Тату Тут</span></span>
    </div>

    <div class="hookwrap">
      <div class="kicker" id="kicker">Идея для Reels</div>
      <div class="hook" id="hook"></div>
    </div>

    <div class="foot">
      <span class="handle">@tatututai</span>
      <span class="src" id="src"></span>
    </div>
  </div>

<script>
  function q(name, def){ const v=new URLSearchParams(location.search).get(name); return v===null?def:v; }
  // подстановка
  document.getElementById('photo').src = q('img','');
  document.getElementById('ric').textContent  = q('ric','🔥');
  document.getElementById('rtext').textContent = q('rtext','ЗАЛЕТЕЛО');
  document.getElementById('kicker').textContent= q('kicker','Идея для Reels');
  document.getElementById('src').textContent   = q('src','');
  // хук: *слово* -> акцент-лайм
  const raw = q('hook','');
  document.getElementById('hook').innerHTML = raw.replace(/\*([^*]+)\*/g,'<span class="ac">$1</span>');
</script>
</body>
</html>
